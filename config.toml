baseURL = "https://loadedartists.coding4.coffee"
languageCode = "en-us"
title = "Loaded Artists"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[pagination]
pagerSize = 5

[params]
mainSections = ["comic"]
twitchApiHost = "https://twitch.loadingartist.com"
fullPostsOnHomePage = 0 # TODO: set this to 1 or 2 again when the draw-them-words post isn't included anymore

[params.author]
fullName = "Gregor Czaykowski & Community"

[imaging]
resampleFilter = "lanczos"
quality = 85

[outputs]
home = ["HTML", "RSS", "JSON"]

[permalinks]
news = "/:year/:month/:day/:filename/"
